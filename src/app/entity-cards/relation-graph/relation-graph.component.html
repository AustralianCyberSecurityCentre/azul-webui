<div
  class="h-full w-full"
  [ngClass]="{
    'dark:bg-azul-800 canvas-max-sizing block bg-white': isFullScreenSignal(),
  }"
>
  <az-loading-card
    cardTitle="Relations"
    [obs$]="graphData$"
    [help]="help"
    [tplTopRight]="tplControls"
    [stylingLiftUpHelp]="isFullScreenSignal()"
  >
    @if (selectedSha256() === currentWindowSha256()) {
      <az-entity-table
        [find$]="findSelectedSha256$"
        [tableScroll]="false"
        [externalPagination]="true"
      ></az-entity-table>
    }
    <div #relationDIV class="h-full w-full">
      <svg
        #relationSVG
        width="100%"
        height="100%"
        class="outline-azul-500 inline-block cursor-grab rounded-xs outline-2 outline-solid"
      ></svg>
      @if (isGraphLoading()) {
        <fa-icon
          class="spinner-ontop"
          [icon]="faSpinner"
          animation="spin"
          size="4x"
        />
      }
    </div>
  </az-loading-card>
</div>

<ng-template #tplControls>
  @if (selectedSha256() === currentWindowSha256()) {
    <flow-tooltip message="De-select sha256">
      <flow-button
        [size]="ButtonSize.Icon"
        [type]="ButtonType.Danger"
        (click)="selectedSha256.set('')"
      >
        <fa-icon [icon]="faFileCircleXmark" />
      </flow-button>
    </flow-tooltip>
  }
  @if (isFullScreenSignal()) {
    <flow-tooltip message="Minimize">
      <flow-button
        [size]="ButtonSize.Icon"
        [type]="ButtonType.Light"
        (click)="isFullScreenSignal.set(false)"
      >
        <fa-icon [icon]="faCompress" />
      </flow-button>
    </flow-tooltip>
  } @else {
    <flow-tooltip message="Maximize">
      <flow-button
        [size]="ButtonSize.Icon"
        [type]="ButtonType.Light"
        (click)="isFullScreenSignal.set(true)"
      >
        <fa-icon [icon]="faExpand" />
      </flow-button>
    </flow-tooltip>
  }

  <flow-tooltip message="Recentre View">
    <flow-button
      [size]="ButtonSize.Icon"
      [type]="ButtonType.Light"
      (click)="rerender$.next(null)"
    >
      <fa-icon [icon]="faEye" />
    </flow-button>
  </flow-tooltip>
  <flow-tooltip message="Zoom In">
    <flow-button
      [size]="ButtonSize.Icon"
      [type]="ButtonType.Light"
      (click)="zoom_in()"
    >
      <fa-icon [icon]="faMagnifyingGlassPlus" />
    </flow-button>
  </flow-tooltip>
  <flow-tooltip message="Zoom Out">
    <flow-button
      [size]="ButtonSize.Icon"
      [type]="ButtonType.Light"
      (click)="zoom_out()"
    >
      <fa-icon [icon]="faMagnifyingGlassMinus" />
    </flow-button>
  </flow-tooltip>
  <flow-tooltip message="Change Complexity">
    <div class="custom-slider w-20">
      <ngx-slider
        [(value)]="complexitySliderValue"
        [options]="complexitySliderOptions"
      ></ngx-slider>
    </div>
  </flow-tooltip>
</ng-template>
